<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>

        <form action="">
            <fieldset>
                <legend><b>Registration Form</b></legend> 
            <label for="u1">User Name: </label>
            <input type="text" id="u1" name="uname" value="" maxlength="20" placeholder="Enter Username" required>

            <br> <br>
            

            <label for="p1">Password: </label>
            <input type="password" id="p1" name="password" min="5" max="15" placeholder="Enter Password"  autofocus>

            <br><br>

            <label for="mail">E-mail: </label>
            <input type="email" id="mail" name="email" placeholder="Enter Email" value="baibhav@gmail.com" disabled>

            <label for="mail">E-mail: </label>
            <input type="email" id="mail" name="email" placeholder="Enter Email" value="baibhav@gmail.com" readonly>

            <br><br>

            <label for="add1">Address: </label>
            <textarea name="add1" id="add1" rows="8" cols="40" placeholder="Enter Address">Jalandhar</textarea>

            <br><br>

            <label for="h1">Hobbies: </label>
            <input type="checkbox" name="hobby" id="chess1" value="chess">
            <label for="chess1">Playing Chess</label>

            <input type="checkbox" name="hobby" id="dance1" value="dance">
            <label for="dance1">Dancing</label>

            <input type="checkbox" name="hobby" id="code1" value="coding">
            <label for="code1">Coding</label>

            <br><br>

            <label for="">Select Course:</label>
            <br>

            <input type="radio" name="course" id="btech" value="btech" checked>
            <label for="btech">B.Tech</label>
            <br>

            <input type="radio" name="course" id="bca" value="bca">
            <label for="bca">BCA</label>
            <br>

            <input type="radio" name="course" id="bsc" value="bsc">
            <label for="bsc">B.Sc</label>
            
            <br><br>


            <label for="state1">Choose State: </label>
            <select name="state" id="state1" size="1" multiple>
                <option value="punjab" >Punjab</option>
                <option value="Bihar" selected >Bihar</option>
                <option value="rajsthan">Rajasthan</option>
                <option value="up">Uttarpradesh</option>
                <option >Gujrat</option>
            </select>  

            <br><br>

            <label for="marks">Enter Marks:</label>
            <input type="number" id="marks" max="20" min="0" step="3">

            <label for="upload">Upload File:</label>
            <input type="file" id="upload" name="upload" accept="image/*">

            <br><br>
            <input type="date" id="date" name="date">
            <input type="time" id="time" name="time">

            <br><br>

            <input type="submit">
            <input type="reset" id="reset">
            <input type="button" value="OK">

            </fieldset>
        </form>

            
    </body>
</html>
