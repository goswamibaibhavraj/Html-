<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>

        <h2>SVG Graphics</h2>

        <svg height="1000" width="1000">
            <rect height="100" width="500" fill="Aqua" x="500" y="20" ></rect>
            <circle r="30" fill="Aqua" cx="50" cy="50"> </circle>
            <ellipse rx="40" ry="20" fill="Red" cx="150" cy="150" > </ellipse>
            <line x1="0" y1="0" x2="900" y2="100" stroke="Green"> </line>
        </svg>
        
        <svg height="800" width="400">
            <circle r="80" fill="Aqua" cx="300" cy="300" > </circle>
        </svg>

        <svg height="800" width="400">
            <polygon points="140 150 160 170 180 190 200 150" fill="yellow">  </polygon>
            <text x="50" y="60" fill="red" font-size="40"> Baibhav Raj</text>
        </svg>

    </body>
</html>
